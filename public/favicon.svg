<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The machine at the instant of release: frame, beam over the top, weight
       down, shot away. Stroked so it survives being drawn at 16px. -->
  <rect width="32" height="32" fill="#14110e"/>
  <g fill="none" stroke="#7a7161" stroke-width="1.6" stroke-linecap="round">
    <path d="M6 26 L15 12 L24 26"/>
    <path d="M3 26 H29"/>
  </g>
  <path d="M7 5 L23 18" stroke="#a97b4f" stroke-width="3" stroke-linecap="round" fill="none"/>
  <rect x="20" y="19" width="6" height="6" fill="#14110e" stroke="#99a0a6" stroke-width="1.5"/>
  <path d="M7 5 L4 13" stroke="#7a7161" stroke-width="1.2" fill="none"/>
  <circle cx="4" cy="13" r="2.6" fill="#ff6b2c"/>
</svg>
