<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The machine at the instant of release: frame, beam over the top, weight
       down, shot away. Strokes are thicker than scale would suggest so the
       mark survives being drawn at 16px in a tab. -->
  <rect width="32" height="32" rx="6" fill="#14110e"/>
  <g fill="none" stroke="#7a7161" stroke-width="2" stroke-linecap="round">
    <path d="M7 26 L15.5 13 L24 26"/>
    <path d="M4 26 H28"/>
  </g>
  <path d="M8 5.5 L23 17.5" stroke="#a97b4f" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <rect x="20" y="19" width="6.5" height="6.5" fill="#14110e" stroke="#99a0a6" stroke-width="1.8"/>
  <path d="M8 5.5 L5 13" stroke="#7a7161" stroke-width="1.4" fill="none"/>
  <circle cx="5" cy="13.5" r="3" fill="#ff6b2c"/>
</svg>
