name: Healthcheck

# Runs on every PR (this is the check that gates review) and on main after a
# merge, so a broken main is visible even if the PR was green against an older
# base.
on:
  pull_request:
  push:
    branches: [main]

# A PR that gets three pushes in a minute only needs the last one checked.
concurrency:
  group: healthcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  healthcheck:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Pinned rather than `latest`: setup-bun only caches the Bun binary when
      # the version is a fixed one (a flexible version can't be cache-keyed on
      # its download URL), and a runtime that changes under you is not something
      # a healthcheck should be reporting on.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `tsc` and `vite` are shebang scripts (`#!/usr/bin/env node`), so `bun run
      # build` shells out to whatever Node is on PATH rather than to Bun. The
      # Node version is therefore a real input to the build, and leaving it as
      # "whatever the runner image ships this week" is how a build starts failing
      # on a day nobody changed anything.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # setup-bun's own cache covers the Bun executable and nothing else — no
      # node_modules, no package downloads. The install cache has to be restored
      # separately or every run re-downloads the whole dependency tree.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      # Every check lives in scripts/healthcheck.sh so CI and a local run cannot
      # disagree about what "healthy" means. It runs all five steps even after
      # one fails, so a red PR reports everything that is wrong in one pass.
      - name: Healthcheck
        run: bun run healthcheck
